# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# Keep built-in names and supplied evaluation cases unchanged.
# Improve descriptions and compatible schemas. Declare team-built bonus tools
# here and in tools/__init__.py, then test them with team-authored cases.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi người dùng khi thiếu thông tin bắt buộc hoặc cần xác nhận hành động. Luôn truyền response_type rõ ràng: text khi cần asset ID/employee ID hoặc dữ liệu tự do; yes_no khi xác nhận đúng một payload; choice khi phải chọn trong options. Không gọi tool đích trong cùng lượt khi đang hỏi bổ sung."
    parameters:
      type: object
      properties:
        question: {type: string, minLength: 1, description: "Một câu hỏi cụ thể nêu đúng thông tin còn thiếu hoặc payload cần xác nhận."}
        response_type: {type: string, enum: [text, yes_no, choice], description: "Bắt buộc truyền rõ kiểu trả lời: text, yes_no hoặc choice."}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn hợp lệ khi response_type là choice; ví dụ [production, staging]."}
      required: [question, response_type]

  - name: search_kb
    description: "Tìm hướng dẫn xử lý trong knowledge base nội bộ. Chọn category theo chủ đề: Outlook, email, webmail và mail profile dùng email; tài khoản bị khóa, password, MFA và SSO account dùng account; Wi-Fi dùng wifi; máy in dùng printing; VPN dùng vpn; bảo mật dùng security; phần cứng dùng hardware; phần mềm/driver dùng software; phòng họp dùng meeting_room."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn. Outlook và mail profile thuộc email, không thuộc account."}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái một dịch vụ."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Môi trường"}
      required: [service]

  - name: inspect_device
    description: "Kiểm tra đúng một thiết bị khi người dùng đã cung cấp asset ID rõ ràng. Asset ID chỉ bắt đầu bằng LT, DT, MB, PR hoặc RM rồi đến dấu gạch ngang và chữ số. Không dùng employee ID EMP-* làm asset ID và không tự gọi tool này chỉ vì lookup_user trả về danh sách thiết bị; chỉ inspect khi yêu cầu hiện tại nói rõ cần kiểm tra thiết bị."
    parameters:
      type: object
      properties:
        asset_id: {type: string, pattern: "^(LT|DT|MB|PR|RM)-[0-9]+$", description: "Mã tài sản rõ ràng như LT-204 hoặc DT-031; không phải employee ID EMP-*."}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], description: "Phạm vi được yêu cầu. Dùng all chỉ khi người dùng yêu cầu kiểm tra tổng thể; nếu nêu VPN, Wi-Fi/network, security, hardware hoặc software thì dùng đúng giá trị tương ứng."}
      required: [asset_id, check]

  - name: lookup_user
    description: "Tra cứu trạng thái tài khoản và danh sách asset được cấp cho đúng một employee ID. Đây chỉ là tra cứu người dùng; không gọi thêm inspect_device khi người dùng chỉ hỏi tài khoản và thiết bị được cấp."
    parameters:
      type: object
      properties:
        employee_id: {type: string, pattern: "^EMP-[0-9]+$", description: "Mã nhân viên rõ ràng dạng EMP-1003; không dùng tên người hoặc phòng ban."}
      required: [employee_id]

  - name: format_incident_report
    description: "Trình bày các kết quả đã có thành báo cáo."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    description: "Tạo một ticket hỗ trợ."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        confirmed: {type: boolean, default: false, description: "Đã được người dùng xác nhận"}
      required: [summary]
